services:
  - type: web
    name: estoque-karoquissimo-api
    runtime: node
    region: oregon
    plan: free
    rootDir: .
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:migrate
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false   # preencher no dashboard do Render
      - key: DIRECT_URL
        sync: false   # preencher no dashboard do Render
      - key: FRONTEND_URL
        sync: false   # URL do Vercel, ex: https://estoque-karoquissimo.vercel.app
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 8h
